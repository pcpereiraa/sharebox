<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
<title>ShareBox — Chat</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/messages.css">
</head>
<body>
<div class="page chat-page">

  <!-- Chat Top Bar (dark) -->
  <header class="chat-top-bar">
    <a class="btn-back" href="messages.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </a>
    <div class="chat-avatar-wrap">
      <div class="chat-avatar" id="chat-avatar"></div>
      <span class="online-dot active"></span>
    </div>
    <div class="chat-header-info">
      <div class="chat-name" id="chat-name">...</div>
      <div class="chat-status" id="chat-status"><span class="online-indicator"></span> Online agora</div>
    </div>
    <button class="chat-menu-btn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
  </header>

  <!-- Item card -->
  <div class="item-reference" id="item-reference"></div>
    <div class="item-ref-info">
      <div class="item-ref-name">Nome do item</div>
      <div class="item-ref-meta">Doação · Bolhão, Porto</div>
    </div>
    <span class="item-ref-badge">Disponível</span>
  </div>

  <main class="chat-messages" id="chat-messages"></main>

  <!-- Input bar -->
  <div class="chat-input-bar">
    <button class="chat-attach-btn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <input class="chat-input" type="text" placeholder="Escreve uma mensagem..." id="msg-input" id="msg-input">
    <button class="chat-send-btn" id="send-btn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
