<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShareBox — Mensagens</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/messages.css">
</head>
<body>
<div class="page">

  <!-- Top Bar (dark) -->
  <header class="top-bar">
    <h1 class="page-title">Mensagens</h1>
    <a class="btn-nova" href="#">+ Nova</a>
  </header>

  <main class="scroll-content">

    <!-- Search Bar -->
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Buscar itens, categorias ou comunidades" readonly>
        <span class="search-filter">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><rect x="3" y="5" width="18" height="2" rx="1" fill="var(--blue)"/><rect x="3" y="11" width="13" height="2" rx="1" fill="var(--blue)"/><rect x="3" y="17" width="8" height="2" rx="1" fill="var(--blue)"/><circle cx="19" cy="17" r="3" fill="var(--blue)"/><circle cx="19" cy="17" r="1.5" fill="var(--bg)"/></svg>
        </span>
      </div>
    </div>

    <!-- Conversation list -->
    <div class="conv-list" id="conv-list"></div>

    <div style="height: 90px"></div>
  </main>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="nav-item" href="home.html"><img src="images/Icons/family_home.png" alt="Home"></a>
    <a class="nav-item" href="communities.html"><img src="images/Icons/icone2@4x-8.png" alt="Comunidades"></a>
    <a class="nav-item nav-add" href="add_item.html"><img src="images/Icons/add_circle.png" alt="Adicionar"></a>
    <a class="nav-item active" href="messages.html"><img src="images/Icons/business_messages.png" alt="Mensagens"></a>
    <a class="nav-item" href="profile.html"><img src="images/Icons/icone5@4x-8.png" alt="Perfil"></a>
  </nav>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
