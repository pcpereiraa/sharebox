<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShareBox">
<link rel="apple-touch-icon" href="images/Logo/logoinicial.png">
<title>ShareBox — Comunidade</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/community_detail.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="page">

  <main class="scroll-content">

    <!-- Hero -->
    <div class="hero">
      <img class="hero-bg" id="hero-bg" src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800&h=400&fit=crop" alt="">
      <div class="hero-overlay"></div>
      <a class="hero-back" href="communities.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </a>
      <div class="hero-info">
        <h1 class="hero-title" id="hero-title">...</h1>
        <div class="hero-location" id="hero-location"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="comm-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-members">—</div>
        <div class="stat-label">Membros</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="stat-items">—</div>
        <div class="stat-label">Anúncios</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-value" id="stat-date">—</div>
        <div class="stat-label">Criada</div>
      </div>
    </div>

    <!-- Botões -->
    <div class="action-btns">
      <a class="btn-aderir" href="#" id="btn-aderir">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Aderir
      </a>
      <a class="btn-partilhar" href="#" onclick="shareCommunity(); return false;">
        <img src="images/Icons/Ativo 11@4x-8.png" alt="">
        Partilhar
      </a>
    </div>

    <div class="body-pad">

      <!-- Descrição -->
      <div class="section-title">Descrição</div>
      <div class="desc-box" id="desc-box">...</div>

      <!-- Local -->
      <div class="section-title" style="margin-top:28px">Local da comunidade</div>
      <div class="location-box">
        <div class="location-row">
          <span class="location-pin">📍</span>
          <span class="location-text" id="location-text">—</span>
        </div>
        <a class="location-map-link" href="#" id="location-map">Ver no mapa →</a>
      </div>

      <!-- Criador -->
      <div class="section-title" style="margin-top:28px">Criador & Admin</div>
      <div class="admin-box">
        <div class="member-avatar" id="admin-avatar" style="background:#c8e6d4;display:flex;align-items:center;justify-content:center;font-family:'Berlin',sans-serif;font-size:18px;color:var(--blue)"></div>
        <div class="member-info">
          <div class="member-name" id="admin-name">—</div>
          <div class="member-sub">Criador da comunidade</div>
        </div>
        <span class="badge admin">Admin</span>
      </div>

      <!-- Itens -->
      <div class="section-title" style="margin-top:28px">Itens anunciados</div>
      <div class="items-scroll-wrap">
        <div class="items-scroll" id="items-scroll"></div>
      </div>

      <!-- Membros -->
      <div class="section-title" style="margin-top:28px" id="members-title">Participantes</div>
      <div class="members-group" id="members-group"></div>

      <!-- Regras -->
      <div class="section-title" style="margin-top:28px">Regras da comunidade</div>
      <div class="rules-group" id="rules-group">
        <div class="rule-item"><span class="rule-text">1. Respeitar todos os membros</span></div>
        <div class="member-divider"></div>
        <div class="rule-item"><span class="rule-text">2. Apenas itens em bom estado</span></div>
        <div class="member-divider"></div>
        <div class="rule-item"><span class="rule-text">3. Sem fins comerciais</span></div>
      </div>

      <div style="height:90px"></div>

    </div>
  </main>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="nav-item" href="home.html"><img src="images/Icons/family_home.png" alt="Home"></a>
    <a class="nav-item active" href="communities.html"><img src="images/Icons/icone2@4x-8.png" alt="Comunidades"></a>
    <a class="nav-item nav-add" href="add_item.html"><img src="images/Icons/add_circle.png" alt="Adicionar"></a>
    <a class="nav-item" href="messages.html"><img src="images/Icons/business_messages.png" alt="Mensagens"></a>
    <a class="nav-item" href="profile.html"><img src="images/Icons/icone5@4x-8.png" alt="Perfil"></a>
  </nav>

</div>

<script src="js/community_detail.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
  function shareCommunity() {
    if (navigator.share) {
      navigator.share({ title: document.getElementById('hero-title').textContent, url: window.location.href });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copiado!');
    }
  }
</script>

<!-- Sheet: Todos os membros -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="sheet-members">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="sheet-members-title">Participantes</span>
    <button class="sheet-close" onclick="closeSheet()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div id="sheet-members-list"></div>
  </div>
</div>

<style>
.sheet-overlay{position:fixed;inset:0;background:rgba(23,42,58,0.5);z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(2px)}
.sheet-overlay.active{opacity:1;pointer-events:all}
.bottom-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:402px;max-height:80vh;background:#f5f5eb;border-radius:24px 24px 0 0;z-index:2100;display:flex;flex-direction:column;transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);box-shadow:0 -8px 40px rgba(23,42,58,0.18)}
.bottom-sheet.active{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(23,42,58,0.2);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;flex-shrink:0;border-bottom:1px solid rgba(23,42,58,0.08)}
.sheet-title{font-family:"Berlin",sans-serif;font-size:18px;color:var(--blue)}
.sheet-close{width:32px;height:32px;background:rgba(23,42,58,0.07);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-close svg{width:18px;height:18px;fill:var(--blue)}
.sheet-body{overflow-y:auto;flex:1;padding:16px 20px 32px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(23,42,58,0.07)}
.sheet-member-row:last-child{border-bottom:none}
.sheet-member-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Berlin",sans-serif;font-size:18px;color:var(--blue);overflow:hidden}
.sheet-member-name{font-family:"Berlin",sans-serif;font-size:14px;font-weight:600;color:var(--blue)}
.sheet-member-sub{font-family:"Berlin",sans-serif;font-size:12px;color:rgba(23,42,58,0.5);margin-top:2px}
</style>

</body>
</html>
