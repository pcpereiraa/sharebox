<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">

<title>ShareBox — Os meus itens</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/my_items.css">

</head>
<body>

<div class="page">

  <!-- Header -->
  <header class="top-bar">
    <a href="profile.html" class="btn-back">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </a>

    <h1 class="page-title">Os meus itens</h1>

    <div style="width:32px"></div>
  </header>

  <main class="scroll-content">

    <!-- Estado atual -->
    <div class="status-banner">
      <span id="current-status">Itens</span>
    </div>

    <!-- Lista -->
    <div id="items-container" class="items-container">

      <!-- Card exemplo -->
      <div class="item-card">

        <img
          src="images/placeholder-item.jpg"
          alt="Item"
          class="item-image"
        >

        <div class="item-content">

          <div class="item-header">
            <h3 class="item-title">Bicicleta de Montanha</h3>

            <span class="item-status available">
              Disponível
            </span>
          </div>

          <p class="item-category">
            Desporto
          </p>

          <p class="item-date">
            Publicado em 15 Jun 2026
          </p>

          <div class="item-actions">

            <button class="btn-edit">
              Editar
            </button>

            <button class="btn-delete">
              Remover
            </button>

          </div>

        </div>

      </div>

    </div>

    <!-- Mensagem caso não existam itens -->
    <div
      id="empty-state"
      class="empty-state"
      style="display:none;"
    >
      <img
        src="images/Icons/add_circle.png"
        alt=""
        class="empty-icon"
      >

      <h3>Ainda não tens itens publicados</h3>

      <p>
        Adiciona o teu primeiro item e começa a partilhar.
      </p>

      <a href="add_item.html" class="btn-empty">
        Adicionar item
      </a>
    </div>

    <div style="height:90px"></div>

  </main>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="nav-item" href="home.html"><img src="images/Icons/family_home.png" alt="Home"></a>
    <a class="nav-item" href="communities.html"><img src="images/Icons/icone2@4x-8.png" alt="Comunidades"></a>
    <a class="nav-item nav-add" href="add_item.html"><img src="images/Icons/add_circle.png" alt="Adicionar"></a>
    <a class="nav-item" href="#"><img src="images/Icons/business_messages.png" alt="Trocas"></a>
    <a class="nav-item active" href="profile.html"><img src="images/Icons/icone5@4x-8.png" alt="Perfil"></a>
  </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/my_items.js"></script>

</body>
</html>
