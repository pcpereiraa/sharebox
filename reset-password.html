<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css"> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js" defer></script>

    <style>
        main {
            margin-top: 20px;
        }

    <title>ShareBox - Nova Palavra-passe</title>

<body>
    <main class="login-screen reset-screen">
        <form id="reset-password-form" class="login-form">

                <input type="password" id="new-pwd" class="input" placeholder="Nova palavra-passe" required>

            <div class="buttons-container">
                <button type="submit" class="btn btn-primary">Atualizar</button>
            </div>
        </form>
    </main>
