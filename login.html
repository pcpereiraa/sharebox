<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js" defer></script>

    <title>ShareBox - Login</title>
</head>
<body>
    <main class="login-screen">
        <div class="logo-container">
            <img src="images/logo/logo_name.png" alt="Logo Sharebox" class="logo">
        </div>

        <form method="post" id="login-form" class="login-form">
            <legend class="form-caption">
                Entrar
            </legend>

            <p>
                <input type="text" name="name" id="login-email" class="input" placeholder="Email ou telemóvel" required>
            </p>

            <p>
                <input type="password" id="login-pwd" class="input" placeholder="Palavra-passe">
            </p>

            <a href="#" id="link-reset" class="rec-pwd">Esqueceste a palavra-passe?</a>

            <div class="buttons-container">
                <button type="submit" class="btn btn-primary">Entrar</button>
                <a href="register.html" class="btn btn-secondary">Criar conta</a>
            </div>
        </form>
    </main>
</body>
</html>
