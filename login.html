<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">

    <title>ShareBox - Login</title>
</head>
<body>
    <main class="login-screen">
        <div class="logo-container">
            <img src="images/logo_name.png" alt="Logo Sharebox" class="logo">
        </div>

        <form action="" method="post" class="login-form">
            <legend class="form-caption">
                Entrar
            </legend>

            <p>
                <input type="text" name="name" id="name-login" class="input" placeholder="Email ou telemóvel" required>
            </p>

            <p>
                <input type="text" class="input" placeholder="Palavra-passe">
            </p>

            <a href="#" class="rec-pwd">Esqueceste a palavra-passe?</a>

            <div class="separator-container">
                <hr class="line">
                <span class="text-or">ou</span>
                <hr class="line">
            </div>

            <div class="login-btns">
                <button class="login-btn">
                    Facebook
                </button>
                <button class="login-btn">
                    Apple
                </button>
            </div>

            <div class="buttons-container">
                <button type="submit" class="btn btn-primary">Entrar</button>
                <a href="register.html" class="btn btn-secondary">Criar conta</a>
            </div>
        </form>
    </main>
</body>
</html>
