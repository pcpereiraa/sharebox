<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#016e58">
<title>ShareBox — As minhas comunidades</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/my_items.css">
<style>
/* ── Community card específico ───────────────────────── */
.comm-card-full {
  background: #fff;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 14px;
  cursor: pointer;
  transition: transform 0.12s;
}
.comm-card-full:hover { transform: translateY(-2px); }

.comm-card-cover {
  width: 100%;
  height: 110px;
  object-fit: cover;
  display: block;
  background: #c8e6d4;
}
.comm-card-cover-placeholder {
  width: 100%;
  height: 110px;
  background: linear-gradient(135deg, #c8e6d4, #b2dfdb);
}

.comm-card-body {
  padding: 14px 16px;
}
.comm-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.comm-card-name {
  font-family: "Berlin", sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--blue);
}
.comm-badge {
  font-family: "Berlin", sans-serif;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 50px;
}
.comm-badge.admin  { background: rgba(1,110,88,0.12); color: var(--dark-green); }
.comm-badge.member { background: rgba(1,110,88,0.07); color: var(--dark-green); }

.comm-card-meta {
  display: flex;
  gap: 14px;
  font-family: "Berlin", sans-serif;
  font-size: 12px;
  color: rgba(23,42,58,0.5);
  margin-bottom: 12px;
}
.comm-card-actions {
  display: flex;
  gap: 10px;
}
.btn-ver {
  flex: 1;
  padding: 10px;
  background: var(--dark-green);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-family: "Berlin", sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  text-align: center;
  text-decoration: none;
  display: block;
}
.btn-ver:hover { background: var(--light-green); }
.btn-sair {
  padding: 10px 18px;
  background: transparent;
  border: 1.5px solid rgba(192,57,43,0.3);
  color: #c0392b;
  border-radius: 50px;
  font-family: "Berlin", sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-sair:hover { background: rgba(192,57,43,0.08); }

/* ── Filter tabs ─────────────────────────────────────── */
.filter-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.filter-tab {
  font-family: "Berlin", sans-serif;
  font-size: 14px;
  padding: 8px 18px;
  border-radius: 50px;
  border: 1.5px solid rgba(23,42,58,0.15);
  background: #fff;
  color: var(--blue);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-tab.active {
  background: var(--dark-green);
  border-color: var(--dark-green);
  color: #fff;
}

/* ── Empty state ─────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 48px 20px;
  gap: 12px;
}
.empty-icon { width: 56px; height: 56px; opacity: 0.3; }
.empty-state h3 {
  font-family: "Berlin", sans-serif;
  font-size: 18px;
  color: var(--blue);
}
.empty-state p {
  font-family: "Berlin", sans-serif;
  font-size: 14px;
  color: rgba(23,42,58,0.5);
}
.btn-empty {
  margin-top: 8px;
  background: var(--dark-green);
  color: #fff;
  font-family: "Berlin", sans-serif;
  font-size: 15px;
  padding: 12px 28px;
  border-radius: 50px;
  text-decoration: none;
}

/* ── Navbar ─────────────────────────────────────────── */
.navbar {
  position: sticky;
  bottom: 0;
  width: 100%;
  height: 80px;
  background: var(--blue);
  border-radius: 24px 24px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 20px;
  z-index: 1000;
  flex-shrink: 0;
  margin-top: auto;
}
.nav-item {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex: 1; cursor: pointer; text-decoration: none;
}
.nav-item img {
  width: 32px; height: 32px; object-fit: contain;
  opacity: 0.45;
  filter: brightness(0) invert(1);
  transition: opacity 0.15s ease;
}
.nav-item.active img {
  opacity: 1;
  filter: brightness(0) saturate(100%) invert(48%) sepia(79%)
          saturate(476%) hue-rotate(120deg) brightness(95%) contrast(91%);
}
.nav-add img {
  width: 40px; height: 40px; opacity: 1;
  filter: brightness(0) saturate(100%) invert(48%) sepia(79%)
          saturate(476%) hue-rotate(120deg) brightness(95%) contrast(91%);
}
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="top-bar">
    <a href="profile.html" class="btn-back">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </a>
    <h1 class="page-title">As minhas comunidades</h1>
    <div style="width:32px"></div>
  </header>

  <main class="scroll-content">

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-role="">Todas</button>
      <button class="filter-tab" data-role="admin">Administro</button>
      <button class="filter-tab" data-role="member">Participo</button>
    </div>

    <!-- Lista -->
    <div id="communities-container"></div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state" style="display:none">
      <img src="images/Icons/icone2@4x-8.png" alt="" class="empty-icon">
      <h3>Ainda não fazes parte de nenhuma comunidade</h3>
      <p>Explora e junta-te a comunidades da tua área.</p>
      <a href="communities.html" class="btn-empty">Explorar comunidades</a>
    </div>

    <div style="height:90px"></div>
  </main>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="nav-item" href="home.html"><img src="images/Icons/family_home.png" alt="Home"></a>
    <a class="nav-item" href="communities.html"><img src="images/Icons/icone2@4x-8.png" alt="Comunidades"></a>
    <a class="nav-item nav-add" href="add_item.html"><img src="images/Icons/add_circle.png" alt="Adicionar"></a>
    <a class="nav-item" href="messages.html"><img src="images/Icons/business_messages.png" alt="Mensagens"></a>
    <a class="nav-item active" href="profile.html"><img src="images/Icons/icone5@4x-8.png" alt="Perfil"></a>
  </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/my_communities.js"></script>
</body>
</html>
