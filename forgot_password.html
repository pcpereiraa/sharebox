<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
<title>ShareBox — Recuperar Palavra-passe</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>
.login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--blue);
}
.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.logo { width: 200px; }
.login-form {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-caption {
  font-family: "Berlin", sans-serif;
  font-size: 24px;
  color: var(--cream);
  font-weight: 400;
}
.form-hint {
  font-family: "Berlin", sans-serif;
  font-size: 14px;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;
  margin: 0;
}
.input {
  width: 100%;
  height: 52px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 0 16px;
  font-family: "Berlin", sans-serif;
  font-size: 15px;
  color: #fff;
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.2s;
}
.input::placeholder { color: rgba(255,255,255,0.4); }
.input:focus { border-color: var(--dark-green); }
.buttons-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn {
  width: 100%;
  padding: 16px;
  border-radius: 50px;
  font-family: "Berlin", sans-serif;
  font-size: 16px;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  border: none;
  display: block;
  box-sizing: border-box;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary {
  background: var(--dark-green);
  color: #fff;
}
.btn-secondary {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.7);
}
#forgot-feedback {
  border-radius: 10px;
  font-family: "Berlin", sans-serif;
  font-size: 14px;
}
</style>
</head>
<body>
<main class="login-screen">

  <div class="logo-container">
    <img src="images/Logo/logo_white.png" alt="ShareBox" class="logo">
  </div>

  <form id="forgot-form" class="login-form">
    <legend class="form-caption">Recuperar Palavra-passe</legend>

    <p class="form-hint">
      Introduz o teu email e enviamos um link para criares uma nova palavra-passe.
    </p>

    <p>
      <input type="email" id="reset-email" class="input" placeholder="O teu email" required>
    </p>

    <div id="forgot-feedback"></div>

    <div class="buttons-container">
      <button type="submit" id="forgot-btn" class="btn btn-primary">Enviar link</button>
      <a href="login.html" class="btn btn-secondary">Voltar ao login</a>
    </div>
  </form>

</main>

<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('reset-email').value.trim();
  const btn   = document.getElementById('forgot-btn');
  const fb    = document.getElementById('forgot-feedback');

  if (!email) return;

  btn.disabled = true;
  btn.textContent = 'A enviar...';

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset_password.html'
  });

  btn.disabled = false;
  btn.textContent = 'Enviar link';

  if (error) {
    fb.textContent = 'Erro: ' + error.message;
    fb.style.cssText = 'color:#c0392b;background:rgba(192,57,43,0.08);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-family:"Berlin",sans-serif;font-size:14px;';
  } else {
    fb.textContent = '✓ Email enviado! Verifica a tua caixa de entrada.';
    fb.style.cssText = 'color:#016e58;background:rgba(1,110,88,0.08);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-family:"Berlin",sans-serif;font-size:14px;';
    document.getElementById('forgot-form').style.opacity = '0.5';
    document.getElementById('forgot-form').style.pointerEvents = 'none';
  }
});
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('[SW] Erro:', err));
    });
  }
</script>
</body>
</html>
