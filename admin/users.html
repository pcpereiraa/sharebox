<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShareBox Admin — Utilizadores</title>
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<!--
  admin/users.html
  ------------------
  Painel de gestão de utilizadores: lista todos os perfis, permite
  pesquisar/filtrar por tipo (admin/normal), editar nome e estatuto
  de admin através de um modal, e eliminar utilizadores.

  Nota de defesa: `deleteUser()` apaga apenas a linha em `profiles` —
  NÃO apaga o utilizador correspondente em `auth.users` (a tabela
  interna de autenticação do Supabase, que só pode ser gerida via
  API administrativa/service role, não pela anon key usada aqui),
  nem os itens, comunidades ou mensagens criados por esse utilizador.
  Na prática isto deixa dados "orfãos" associados a um id de
  utilizador que já não tem perfil — um ponto a referir como possível
  limitação/melhoria futura.
-->
<div class="admin-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/Logo/logoinicial.png" alt="ShareBox">
      <span>Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a class="nav-link active" href="users.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        Utilizadores
      </a>
      <a class="nav-link" href="items.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-2.18c.07-.44.18-.88.18-1.33C18 2.54 15.96.5 13.5.5c-1.5 0-2.81.75-3.6 1.88L9 3.5l-.9-1.13C7.31 1.25 6 .5 4.5.5 2.04.5 0 2.54 0 4.67c0 .45.11.89.18 1.33H0v2h20V6zM9 19h6l1-8H8l1 8z"/></svg>
        Itens
      </a>
      <a class="nav-link" href="communities.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Comunidades
      </a>
      <a class="nav-link" href="reports.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        Reportes
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-user">
        <div class="admin-avatar" id="admin-avatar"></div>
        <div class="admin-info">
          <div class="admin-name" id="admin-name">Admin</div>
          <div class="admin-role">Administrador</div>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Utilizadores</h1>
      <span class="page-date" id="current-date"></span>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:28px">
      <div class="stat-card">
        <div class="stat-icon users"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
        <div class="stat-info"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon items"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></div>
        <div class="stat-info"><div class="stat-value" id="stat-admins">—</div><div class="stat-label">Admins</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon communities"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
        <div class="stat-info"><div class="stat-value" id="stat-new">—</div><div class="stat-label">Novos (7 dias)</div></div>
      </div>
    </div>

    <!-- Search + Filter -->
    <div class="table-card">
      <div class="table-card-header">
        <h2>Todos os utilizadores</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" id="search-input" placeholder="Pesquisar..." style="padding:8px 14px;border:1px solid rgba(23,42,58,0.15);border-radius:8px;font-family:'Berlin',sans-serif;font-size:13px;outline:none;width:200px">
          <select id="filter-admin" style="padding:8px 14px;border:1px solid rgba(23,42,58,0.15);border-radius:8px;font-family:'Berlin',sans-serif;font-size:13px;outline:none;cursor:pointer">
            <option value="">Todos</option>
            <option value="true">Admins</option>
            <option value="false">Utilizadores</option>
          </select>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Username</th>
            <th>Localização</th>
            <th>Admin</th>
            <th>Criado em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="loading-row">A carregar...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal de edição de utilizador: reutilizado para qualquer
     utilizador clicado em "Editar" (controlado por `editingId`) -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:28px;width:400px;max-width:90vw">
    <h3 style="font-family:'Berlin',sans-serif;font-size:18px;color:#172a3a;margin-bottom:20px" id="modal-title">Editar Utilizador</h3>
    <div style="margin-bottom:14px">
      <label style="font-family:'Berlin',sans-serif;font-size:14px;color:#172a3a;display:block;margin-bottom:6px">Nome completo</label>
      <input id="modal-name" type="text" style="width:100%;padding:10px 14px;border:1px solid rgba(23,42,58,0.15);border-radius:10px;font-family:'Berlin',sans-serif;font-size:14px;outline:none">
    </div>
    <div style="margin-bottom:14px">
      <label style="font-family:'Berlin',sans-serif;font-size:14px;color:#172a3a;display:block;margin-bottom:6px">Admin</label>
      <select id="modal-admin" style="width:100%;padding:10px 14px;border:1px solid rgba(23,42,58,0.15);border-radius:10px;font-family:'Berlin',sans-serif;font-size:14px;outline:none">
        <option value="false">Utilizador normal</option>
        <option value="true">Administrador</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeModal()" style="padding:10px 20px;border:1px solid rgba(23,42,58,0.2);border-radius:50px;background:transparent;font-family:'Berlin',sans-serif;font-size:14px;cursor:pointer">Cancelar</button>
      <button onclick="saveUser()" style="padding:10px 20px;background:#016e58;color:#fff;border:none;border-radius:50px;font-family:'Berlin',sans-serif;font-size:14px;cursor:pointer">Guardar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ijswdmvksmqldhkyghwr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlqc3dkbXZrc21xbGRoa3lnaHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NjYxODgsImV4cCI6MjA5NDM0MjE4OH0.8JuKWiWxKQ0GN-7MmfIcuZE1BAfbNR3oxPMY89amBAM';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// `allUsers` guarda a lista completa para pesquisa/filtro local;
// `editingId` guarda o id do utilizador atualmente a ser editado no
// modal (null quando o modal está fechado).
let allUsers = [];
let editingId = null;

/**
 * adminGuard
 * ----------
 * Proteção padrão das páginas de admin: exige sessão válida E
 * `is_admin = true`, caso contrário redireciona.
 *
 * @returns {Promise<boolean>} true se o acesso for permitido.
 */
async function adminGuard() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '../login.html'; return false; }
  const { data } = await sb.from('profiles').select('is_admin, full_name').eq('id', session.user.id).single();
  if (!data?.is_admin) { window.location.href = '../home.html'; return false; }
  document.getElementById('admin-name').textContent = data.full_name || 'Admin';
  document.getElementById('admin-avatar').textContent = (data.full_name || 'A')[0].toUpperCase();
  return true;
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut(); window.location.href = '../login.html';
});
document.getElementById('current-date').textContent = new Date().toLocaleDateString('pt-PT', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

/**
 * loadUsers
 * ---------
 * Carrega todos os perfis da plataforma e calcula as estatísticas do
 * topo (total, nº de admins, nº de novos registos nos últimos 7
 * dias). Estas estatísticas são todas calculadas em memória com
 * `.filter()` sobre o array já carregado, sem queries extra à BD.
 */
async function loadUsers() {
  const { data } = await sb.from('profiles').select('id, full_name, username, location, is_admin, created_at').order('created_at', { ascending: false });
  allUsers = data || [];

  // Stats
  document.getElementById('stat-total').textContent = allUsers.length;
  document.getElementById('stat-admins').textContent = allUsers.filter(u => u.is_admin).length;
  // Calcula a data de "há 7 dias" subtraindo diretamente ao objeto
  // Date atual, e depois filtra os utilizadores criados depois dessa
  // data — abordagem simples, sem precisar de fazer isto na BD.
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  document.getElementById('stat-new').textContent = allUsers.filter(u => new Date(u.created_at) > weekAgo).length;

  renderUsers(allUsers);
}

/**
 * renderUsers
 * -----------
 * Constrói as linhas da tabela de utilizadores a partir de uma lista
 * (completa ou já filtrada pela pesquisa/seletor de admin).
 *
 * @param {Array<Object>} users - Lista de perfis a desenhar.
 */
function renderUsers(users) {
  const tbody = document.getElementById('users-tbody');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Sem utilizadores</td></tr>'; return; }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.full_name || '—'}</strong></td>
      <td class="text-muted">@${u.username || '—'}</td>
      <td class="text-muted">${u.location || '—'}</td>
      <td>${u.is_admin ? '<span class="badge admin">Admin</span>' : '<span class="badge user">User</span>'}</td>
      <td class="text-muted">${formatDate(u.created_at)}</td>
      <td style="display:flex;gap:6px">
        <button class="btn-action edit" onclick="openEdit('${u.id}','${(u.full_name||'').replace(/'/g,"\\'")}',${u.is_admin})">Editar</button>
        <button class="btn-action delete" onclick="deleteUser('${u.id}')">Eliminar</button>
      </td>
    </tr>
  `).join('');
}

// Search + filter
// Pesquisa local por nome/username e filtro por estatuto de admin —
// ambos atuam sobre `allUsers` já carregado, sem nova query à BD.
document.getElementById('search-input').addEventListener('input', filterUsers);
document.getElementById('filter-admin').addEventListener('change', filterUsers);
/**
 * filterUsers
 * -----------
 * Aplica a pesquisa de texto e o filtro de estatuto de admin sobre a
 * lista completa de utilizadores e redesenha a tabela.
 */
function filterUsers() {
  const q     = document.getElementById('search-input').value.toLowerCase();
  const admin = document.getElementById('filter-admin').value;
  let filtered = allUsers;
  if (q) filtered = filtered.filter(u => (u.full_name||'').toLowerCase().includes(q) || (u.username||'').toLowerCase().includes(q));
  // O valor do <select> vem sempre como string ('true'/'false'/''),
  // por isso compara-se com `String(u.is_admin)` em vez do booleano
  // diretamente.
  if (admin !== '') filtered = filtered.filter(u => String(u.is_admin) === admin);
  renderUsers(filtered);
}

// Edit modal
/**
 * openEdit
 * --------
 * Abre o modal de edição pré-preenchido com os dados atuais do
 * utilizador selecionado, e guarda o seu id em `editingId` para que
 * `saveUser()` saiba a quem aplicar as alterações.
 *
 * @param {string} id - UUID do utilizador a editar.
 * @param {string} name - Nome atual (já escapado de aspas simples no
 *                         `onclick` que invoca esta função).
 * @param {boolean} isAdmin - Estatuto atual de admin.
 */
function openEdit(id, name, isAdmin) {
  editingId = id;
  document.getElementById('modal-name').value = name;
  document.getElementById('modal-admin').value = String(isAdmin);
  document.getElementById('modal-overlay').style.display = 'flex';
}
/**
 * closeModal
 * ----------
 * Fecha o modal de edição e limpa o `editingId` (evita que um
 * "Guardar" tardio afete o utilizador errado).
 */
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  editingId = null;
}
/**
 * saveUser
 * --------
 * Aplica as alterações feitas no modal (nome e estatuto de admin) ao
 * perfil identificado por `editingId`, e recarrega a lista.
 *
 * Nota: alterar `is_admin` aqui é uma operação sensível — concede ou
 * retira poder total de administração sobre toda a plataforma a um
 * utilizador.
 */
async function saveUser() {
  const name    = document.getElementById('modal-name').value.trim();
  const isAdmin = document.getElementById('modal-admin').value === 'true';
  await sb.from('profiles').update({ full_name: name, is_admin: isAdmin }).eq('id', editingId);
  closeModal();
  loadUsers();
}

/**
 * deleteUser
 * ----------
 * Elimina o perfil de um utilizador (ver nota no topo do ficheiro
 * sobre as limitações desta operação — não remove o utilizador de
 * `auth.users` nem os seus itens/comunidades/mensagens).
 *
 * @param {string} id - UUID do perfil a eliminar.
 */
async function deleteUser(id) {
  if (!confirm('Tens a certeza que queres eliminar este utilizador?')) return;
  await sb.from('profiles').delete().eq('id', id);
  loadUsers();
}

/**
 * formatDate
 * ----------
 * Formata uma data ISO para o formato curto pt-PT (DD-MM-AAAA).
 *
 * @param {string|null} iso - Data em formato ISO, ou null/undefined.
 * @returns {string} Data formatada, ou '—' se não existir.
 */
function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric' });
}

/**
 * init
 * ----
 * Ponto de entrada da página: valida o acesso de admin e, se válido,
 * carrega a lista de utilizadores.
 */
async function init() {
  const ok = await adminGuard();
  if (ok) loadUsers();
}
init();
</script>
</body>
</html>
