<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
<title>ShareBox — Nova Palavra-passe</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</head>
<body>
<main class="login-screen">

  <div class="logo-container">
    <img src="images/Logo/logo_white.png" alt="ShareBox" class="logo">
  </div>

  <!-- Estado: a processar token -->
  <div id="state-loading" class="login-form" style="text-align:center">
    <p style="font-family:'Berlin',sans-serif;font-size:15px;color:rgba(23,42,58,0.6)">A verificar...</p>
  </div>

  <!-- Estado: token inválido ou expirado -->
  <div id="state-invalid" class="login-form" style="display:none">
    <legend class="form-caption">Link inválido</legend>
    <p style="font-family:'Berlin',sans-serif;font-size:14px;color:rgba(23,42,58,0.6);margin-bottom:20px;line-height:1.5">
      Este link expirou ou já foi utilizado. Pede um novo link de recuperação.
    </p>
    <div class="buttons-container">
      <a href="forgot_password.html" class="btn btn-primary">Pedir novo link</a>
      <a href="login.html" class="btn btn-secondary">Voltar ao login</a>
    </div>
  </div>

  <!-- Estado: formulário nova password -->
  <form id="state-form" class="login-form" style="display:none">
    <legend class="form-caption">Nova Palavra-passe</legend>

    <p>
      <input type="password" id="new-pwd" class="input" placeholder="Nova palavra-passe" required minlength="6">
    </p>
    <p>
      <input type="password" id="confirm-pwd" class="input" placeholder="Confirmar palavra-passe" required minlength="6">
    </p>

    <div id="reset-feedback"></div>

    <div class="buttons-container">
      <button type="submit" id="reset-btn" class="btn btn-primary">Guardar</button>
    </div>
  </form>

  <!-- Estado: sucesso -->
  <div id="state-success" class="login-form" style="display:none;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">✓</div>
    <legend class="form-caption">Palavra-passe alterada!</legend>
    <p style="font-family:'Berlin',sans-serif;font-size:14px;color:rgba(23,42,58,0.6);margin-bottom:20px">
      A tua palavra-passe foi actualizada com sucesso.
    </p>
    <div class="buttons-container">
      <a href="login.html" class="btn btn-primary">Entrar na conta</a>
    </div>
  </div>

</main>

<script>
function showState(id) {
  ['state-loading','state-invalid','state-form','state-success'].forEach(s => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

async function init() {
  // Supabase envia o token no hash da URL: #access_token=...&type=recovery
  const hash   = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const type   = params.get('type');
  const token  = params.get('access_token');

  if (type === 'recovery' && token) {
    // Definir a sessão com o token de recovery
    const { error } = await supabaseClient.auth.setSession({
      access_token:  token,
      refresh_token: params.get('refresh_token') || ''
    });

    if (error) {
      showState('state-invalid');
    } else {
      showState('state-form');
    }
  } else {
    // Verificar se já há sessão activa (utilizador veio do email)
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showState('state-form');
    } else {
      showState('state-invalid');
    }
  }
}

document.getElementById('state-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const pwd     = document.getElementById('new-pwd').value;
  const pwd2    = document.getElementById('confirm-pwd').value;
  const btn     = document.getElementById('reset-btn');
  const fb      = document.getElementById('reset-feedback');

  if (pwd.length < 6) {
    showFeedback(fb, 'A palavra-passe deve ter pelo menos 6 caracteres.', 'error'); return;
  }
  if (pwd !== pwd2) {
    showFeedback(fb, 'As palavras-passe não coincidem.', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = 'A guardar...';

  const { error } = await supabaseClient.auth.updateUser({ password: pwd });

  btn.disabled = false;
  btn.textContent = 'Guardar';

  if (error) {
    showFeedback(fb, 'Erro: ' + error.message, 'error');
  } else {
    await supabaseClient.auth.signOut();
    showState('state-success');
  }
});

function showFeedback(el, msg, type) {
  el.textContent = msg;
  el.style.cssText = `display:block;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-family:"Berlin",sans-serif;font-size:14px;color:${type==='error'?'#c0392b':'#016e58'};background:${type==='error'?'rgba(192,57,43,0.08)':'rgba(1,110,88,0.08)'};`;
}

init();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('[SW] Erro:', err));
    });
  }
</script>
</body>
</html>
