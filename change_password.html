<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShareBox — Alterar Password</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/profile.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="page">

  <header class="top-bar-dark">
    <a class="btn-back-white" href="profile.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </a>
    <h1 class="page-title-white">Alterar Password</h1>
    <div style="width:36px"></div>
  </header>

  <main class="scroll-content">
    <div class="settings-form">

      <div id="pwd-feedback"></div>

      <div class="field-group">
        <label class="field-label">Nova password</label>
        <input class="field-input" type="password" id="new-pwd" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="field-group">
        <label class="field-label">Confirmar nova password</label>
        <input class="field-input" type="password" id="confirm-pwd" placeholder="Repete a password">
      </div>

      <button class="btn-save" id="btn-pwd" onclick="changePassword()">Alterar password</button>

    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  await requireAuth();
});

async function changePassword() {
  const btn = document.getElementById('btn-pwd');
  const pwd  = document.getElementById('new-pwd').value;
  const pwd2 = document.getElementById('confirm-pwd').value;
  const fb   = document.getElementById('pwd-feedback');

  if (pwd.length < 6) { showMsg(fb, 'A password deve ter pelo menos 6 caracteres.', 'error'); return; }
  if (pwd !== pwd2)   { showMsg(fb, 'As passwords não coincidem.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'A alterar...';

  const { error } = await supabaseClient.auth.updateUser({ password: pwd });

  btn.disabled = false;
  btn.textContent = 'Alterar password';

  if (error) {
    showMsg(fb, 'Erro: ' + error.message, 'error');
  } else {
    showMsg(fb, '✓ Password alterada com sucesso!', 'success');
    setTimeout(() => window.location.href = 'profile.html', 1800);
  }
}

function showMsg(el, msg, type) {
  el.textContent = msg;
  el.style.cssText = `display:block;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-family:"Berlin",sans-serif;font-size:14px;color:${type==='error'?'#c0392b':'#016e58'};background:${type==='error'?'rgba(192,57,43,0.08)':'rgba(1,110,88,0.08)'};`;
}
</script>

<style>
.top-bar-dark {
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;background:var(--blue);flex-shrink:0;gap:12px;
}
.btn-back-white {
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;text-decoration:none;
}
.btn-back-white svg { width:22px;height:22px;fill:#fff; }
.page-title-white {
  font-family:"Berlin",sans-serif;font-size:20px;
  color:#fff;font-weight:400;flex:1;text-align:center;
}
.settings-form { padding:24px 20px; }
.field-group { margin-bottom:16px; }
.field-label { font-family:"Berlin",sans-serif;font-size:15px;color:var(--blue);display:block;margin-bottom:8px; }
.field-input {
  width:100%;height:48px;background:#fff;border:1px solid rgba(23,42,58,0.12);
  border-radius:12px;padding:0 14px;font-family:"Berlin",sans-serif;font-size:14px;
  color:var(--blue);outline:none;box-shadow:0 2px 10px rgba(23,42,58,0.08);
}
.field-input:focus { border-color:var(--dark-green); }
.btn-save {
  width:100%;padding:16px;background:var(--dark-green);color:#fff;
  font-family:"Berlin",sans-serif;font-size:18px;border:none;border-radius:50px;cursor:pointer;margin-top:8px;
}
</style>

</body>
</html>
