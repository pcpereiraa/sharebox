<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="images/Logo/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>


    <title>ShareBox</title>
</head>
<body>
    <main class="index-screen">
        <div class="logo-container">
            <img src="images/Logo/logo_white.png" alt="Logo Sharebox" class="logo">
            <p class="slogan">
                Partilha mais. <br> Desperdiça menos.
            </p>
        </div>

        <div class="buttons-container">
            <a href="register.html" class="btn btn-primary">Criar conta</a>
            <a href="login.html" class="btn btn-secondary">Já tenho uma conta</a>
        </div>
        
    </main>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('js/sw.js')
        .then(reg => console.log('[SW] Registado:', reg.scope))
        .catch(err => console.error('[SW] Erro:', err));
    });
  }
</script>
</body>
</html>
