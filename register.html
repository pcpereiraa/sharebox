<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/register.css">

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

    <title>ShareBox - Registo</title>
  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShareBox">
  <link rel="apple-touch-icon" href="images/Logo/logoinicial.png">
</head>
<body>
    <main class="register-screen">
        <div class="logo-container">
            <img src="images/Logo/logo_white.png" alt="Logo Sharebox" class="logo">
        </div>
        
        <form id="register-form" class="register-form">
            <legend class="form-caption">
                Criar conta
            </legend>

            
            <p>
                <input type="text" name="name" id="input-name" class="input input-name" placeholder="Nome" required>
            </p>

            <p>
                <input type="text" name="surname" id="input-surname" class="input input-surname" placeholder="Apelido" required>
            </p>

            <p>
                <input type="email" name="email" id="input-email" class="input" placeholder="Email" required>
            </p>

            <p>
                <input type="tel" name="tel" id="input-tel" class="input" placeholder="Telemóvel (opcional)">
            </p>

            <p>
                <input type="password" name="pwd" id="input-pwd" class="input" placeholder="Palavra-Passe" required>
            </p>

            <p>
                <input type="password" name="pwd2" id="input-pwd2" class="input" placeholder="Confirmar palavra-passe" required>
            </p>

            <div id="register-error" style="display:none"></div>
            <div class="buttons-container">
                <button type="submit" id="register-submit" class="btn btn-primary">Criar conta</button>
                <a href="login.html" class="btn btn-secondary">Já tenho uma conta</a>
            </div>
        </form>

        
    </main>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('[SW] Registado:', reg.scope))
        .catch(err => console.error('[SW] Erro:', err));
    });
  }
</script>
</body>
</html>
